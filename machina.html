<body>
<header>
  <h1>Machina</h1>
  <p class="caption">A tower in the fog with one eye. Move and it wakes. Hold still and it reaches for you. Type and it ticks, one tooth at a time.</p>
</header>
<p class="status" id="status" aria-live="polite">asleep</p>
<footer><a href="https://joezgao.github.io/">Joe Gao</a></footer>
<noscript><p class="fallback">This piece needs JavaScript and WebGL.</p></noscript>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three'

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
const light = matchMedia('(prefers-color-scheme: light)')
const statusEl = document.getElementById('status')

let renderer
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' })
} catch (err) {
  const p = document.createElement('p'); p.className = 'fallback'
  p.textContent = 'This browser could not start WebGL, so the tower stays hidden.'
  document.body.append(p); throw err
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.setClearColor(0x000000, 1)
renderer.domElement.setAttribute('aria-label', 'A black tower in fog under the moon, crowned by a cloud of meshing gears, with one red eye that opens when you move.')
renderer.domElement.setAttribute('role', 'img')
document.body.prepend(renderer.domElement)

// ---------- scene ----------
const FOG = new THREE.Color(0.006, 0.006, 0.006)  // linear; shows as ~0.07 after sRGB
const scene = new THREE.Scene()
scene.fog = new THREE.FogExp2(FOG, 0.045)
scene.background = new THREE.Color(0.012, 0.012, 0.012)

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200)
const camHome = new THREE.Vector3(0, 4.5, 27)
camera.position.copy(camHome)

const moonLight = new THREE.DirectionalLight(0xffffff, 2.4)
moonLight.position.set(-14, 22, -30)
const rim = new THREE.DirectionalLight(0xffffff, 3.2)
rim.position.set(-30, 30, 10)
// a cold key from the right so one face of the tower catches light
const key = new THREE.DirectionalLight(0xffffff, 2.2)
key.position.set(24, 10, 18)
scene.add(moonLight, rim, key, new THREE.AmbientLight(0xffffff, 0.18))

// moon: the one white disc
const moon = new THREE.Mesh(new THREE.CircleGeometry(2.0, 64), new THREE.MeshBasicMaterial({ color: 0xa0a0a0, fog: false }))
moon.position.set(-30, 34, -85)
scene.add(moon)
const halo = new THREE.Mesh(new THREE.CircleGeometry(9, 64), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.05, fog: false, depthWrite: false }))
halo.position.copy(moon.position).add(new THREE.Vector3(0, 0, -0.5))
scene.add(halo)

// sky: the fog glows near the horizon so the tower stands black against it
const skyGeo = new THREE.PlaneGeometry(600, 120, 240, 24)
const skyCol = []
for (let i = 0; i < skyGeo.attributes.position.count; i++) {
  // a ragged top edge: the glow's height wanders along x, so the dither threshold never draws a ruled line
  const x = skyGeo.attributes.position.getX(i)
  const rag = 0.035 * (Math.sin(x * 0.11) + 0.6 * Math.sin(x * 0.29 + 1.7) + 0.35 * Math.sin(x * 0.73 + 4.1))
  const y = Math.min(1, Math.max(0, skyGeo.attributes.position.getY(i) / 60 * 0.5 + 0.5 + rag))
  // a wide low glow so the tower stands black against it all the way up to its crown
  const v = 0.16 * Math.pow(1 - y, 9) + 0.05 * Math.pow(1 - y, 3)
  skyCol.push(v, v, v)
}
skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(skyCol, 3))
const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, fog: false, depthWrite: false }))
sky.position.set(0, 60, -90)
scene.add(sky)

// ground: unlit, so only the fog lights it; the horizon glows and the foreground stays black
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshBasicMaterial({ color: 0x000000 }))
ground.rotation.x = -Math.PI / 2
scene.add(ground)

// tower: a stack of monolith segments; it grows one segment each long stretch of attention
const towerMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.7, metalness: 0.6, fog: false })
const tower = new THREE.Group()
scene.add(tower)
const SEG_H = 3.1, SEG_GAP = 0.14
const segs = []
function addSegment(i) {
  const w = 1.5 - i * 0.12
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, SEG_H, w * 0.7), towerMat)
  m.position.y = SEG_H / 2 + i * (SEG_H + SEG_GAP)
  m.userData.grow = i < 3 ? 1 : 0
  m.scale.y = m.userData.grow || 0.001
  tower.add(m); segs.push(m)
}
for (let i = 0; i < 3; i++) addSegment(i)
const towerTop = () => segs.reduce((h, s) => Math.max(h, s.position.y - SEG_H / 2 + SEG_H * s.scale.y), 0)

// eye: pure red, kept out of the fog so the dither pass can find it
const eye = new THREE.Group()
const EYE_Y = 7.1
eye.position.set(0, EYE_Y, 0.56)
const red = new THREE.MeshBasicMaterial({ color: 0xff0000, fog: false })
const iris = new THREE.Mesh(new THREE.CircleGeometry(0.34, 48), red)
const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.11, 32), new THREE.MeshBasicMaterial({ color: 0x000000, fog: false }))
pupil.position.z = 0.002
const lid = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.025), new THREE.MeshBasicMaterial({ color: 0x400000, fog: false }))
const glow = new THREE.Mesh(new THREE.CircleGeometry(0.75, 48), new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0, fog: false, depthWrite: false, blending: THREE.AdditiveBlending }))
glow.position.z = -0.001
eye.add(glow, iris, pupil, lid)
scene.add(eye)
const seam = new THREE.Mesh(new THREE.PlaneGeometry(0.12, EYE_Y - 0.45), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, fog: false, depthWrite: false }))
seam.position.set(0, (EYE_Y - 0.45) / 2, 0.57)
scene.add(seam)
let seamLit = 0

// the mechanical cloud: a train of filled gears that really mesh, circuit traces hub to hub, and a haze of points
const cloud = new THREE.Group()
scene.add(cloud)
const MOD = 0.22 // gear module: pitch radius = MOD * teeth / 2
// each gear hangs off a parent at an angle and meshes with it
const GEARS = [
  { teeth: 24, x: 0, y: 0.4 },
  { teeth: 16, parent: 0, at: 200 },
  { teeth: 12, parent: 1, at: 205 },
  { teeth: 20, parent: 0, at: -14 },
  { teeth: 12, parent: 3, at: 62 },
  { teeth: 14, parent: 3, at: -12 },
  { teeth: 18, parent: 5, at: 40 },
]
function gearShape(t) {
  const r = MOD * t / 2, tip = r + MOD, root = r - 1.25 * MOD
  const s = new THREE.Shape()
  for (let i = 0; i < t; i++) {
    const a0 = (i / t) * Math.PI * 2, w = (Math.PI * 2) / t
    const p = [[root, -0.5], [root, -0.27], [tip, -0.15], [tip, 0.15], [root, 0.27]]
    p.forEach(([rr, f], j) => {
      const a = a0 + f * w
      i === 0 && j === 0 ? s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr)
    })
  }
  s.closePath()
  // windows between spokes, and the axle hole
  const rim = root - Math.max(0.28, r * 0.16), hub = Math.max(0.32, r * 0.3)
  const n = t >= 24 ? 5 : t >= 16 ? 4 : 3
  const hw = (r * 0.09) / ((rim + hub) / 2)
  for (let k = 0; k < n; k++) {
    const a = (k / n) * Math.PI * 2 + hw, b = ((k + 1) / n) * Math.PI * 2 - hw
    const h = new THREE.Path()
    h.absarc(0, 0, rim, a, b, false)
    h.absarc(0, 0, hub, b, a, true)
    h.closePath()
    s.holes.push(h)
  }
  const axle = new THREE.Path(); axle.absarc(0, 0, hub * 0.35, 0, Math.PI * 2, true); s.holes.push(axle)
  return s
}
const rings = []
GEARS.forEach((d) => {
  const r = MOD * d.teeth / 2
  let x = d.x, y = d.y, dir = 1, angle = Math.random() * 6
  if (d.parent !== undefined) {
    const P = rings[d.parent].userData, th = (d.at * Math.PI) / 180, dist = P.r + r
    x = P.x + Math.cos(th) * dist; y = P.y + Math.sin(th) * dist; dir = -P.dir
    // phase so a tooth of the parent sits in a gap of this gear on the line between their centres
    const pA = ((th - P.angle) * P.teeth) / (Math.PI * 2)
    angle = th + Math.PI - (Math.PI * 2 * (0.5 - pA)) / d.teeth
  }
  const shade = d.far ? 0x3a3a3a : 0xbdbdbd
  const mesh = new THREE.Mesh(new THREE.ShapeGeometry(gearShape(d.teeth), 6), new THREE.MeshBasicMaterial({ color: shade, fog: false, side: THREE.DoubleSide }))
  const g = new THREE.Group()
  g.add(mesh)
  g.position.set(x, y, d.z || 0)
  g.userData = { r, x, y, teeth: d.teeth, dir, mesh, step: (Math.PI * 2) / d.teeth, angle, target: angle, drift: 0.05 * dir * (24 / d.teeth) * (d.far ? 0.4 : 1) }
  mesh.rotation.z = angle
  cloud.add(g)
  rings.push(g)
})

// circuit traces: right-angle runs from the tower's crown up to each gear hub; one lights each time you type
const traces = []
const rand = mulberry(7)
const TW = 0.07
function seg(a, b, mat) {
  const len = Math.hypot(b.x - a.x, b.y - a.y)
  const m = new THREE.Mesh(new THREE.PlaneGeometry(b.x === a.x ? TW : len + TW, b.x === a.x ? len + TW : TW), mat)
  m.position.set((a.x + b.x) / 2, (a.y + b.y) / 2, 0.03)
  return m
}
rings.filter((g) => g.position.z === 0).forEach((g, i) => {
  const u = g.userData
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2, fog: false, depthWrite: false })
  const tr = new THREE.Group()
  const sx = (i - 3) * 0.16, bendY = -2.2 + i * 0.28
  const pts = [{ x: sx, y: -2.6 }, { x: sx, y: bendY }, { x: u.x, y: bendY }, { x: u.x, y: u.y }]
  for (let k = 0; k < 3; k++) tr.add(seg(pts[k], pts[k + 1], mat))
  tr.material = mat
  tr.userData.lit = 0
  cloud.add(tr); traces.push(tr)
})

// haze
const HN = 1400
const hp = new Float32Array(HN * 3)
for (let i = 0; i < HN; i++) {
  const a = rand() * Math.PI * 2, r = 2 + Math.pow(rand(), 0.7) * 11
  hp[i * 3] = Math.cos(a) * r; hp[i * 3 + 1] = (rand() - 0.5) * (1.2 + r * 0.15); hp[i * 3 + 2] = Math.sin(a) * r
}
const hazeGeo = new THREE.BufferGeometry(); hazeGeo.setAttribute('position', new THREE.BufferAttribute(hp, 3))
const haze = new THREE.Points(hazeGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.45 }))
cloud.add(haze)

// ---------- 1-bit ordered dither, with the red eye kept as the only colour ----------
const rt = new THREE.WebGLRenderTarget(1, 1, { samples: 0 })
const post = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: rt.texture }, res: { value: new THREE.Vector2(1, 1) }, cell: { value: 2 },
    ink: { value: new THREE.Color(0xededed) }, paper: { value: new THREE.Color(0x000000) },
    accent: { value: new THREE.Color(0xe5372b) }, gain: { value: 1.0 },
    quiet: { value: new THREE.Vector4(0, 0, 0, 0) }, bottomQuiet: { value: 0 }, feather: { value: 24 },
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `
    uniform sampler2D tScene; uniform vec2 res; uniform float cell, gain;
    uniform vec3 ink, paper, accent;
    uniform vec4 quiet; uniform float bottomQuiet, feather;
    float bayer4(vec2 p){
      int x = int(mod(p.x, 4.)), y = int(mod(p.y, 4.));
      int i = x + y * 4;
      float m[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
      for (int k = 0; k < 16; k++) if (k == i) return (m[k] + .5) / 16.;
      return .5;
    }
    void main(){
      vec2 c = floor(gl_FragCoord.xy / cell);
      vec3 col = texture2D(tScene, (c + .5) * cell / res).rgb;
      float redness = col.r - max(col.g, col.b);
      float l = pow(dot(col, vec3(.299, .587, .114)) * gain, .9);
      float t = bayer4(c);
      vec2 q = gl_FragCoord.xy;
      vec2 dq = max(max(quiet.xy - q, q - quiet.zw), 0.);
      l *= smoothstep(0., feather, length(dq)) * smoothstep(bottomQuiet, bottomQuiet + feather, q.y);
      vec3 o = mix(paper, ink, step(t, l));
      if (redness > .04) o = mix(o, accent, step(t, redness * 1.6));
      gl_FragColor = vec4(o, 1.);
    }`,
  depthTest: false, depthWrite: false,
})
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post)
const postScene = new THREE.Scene(); postScene.add(quad)
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)
function setTheme() {
  const isLight = light.matches
  post.uniforms.ink.value.set(isLight ? 0x111111 : 0xededed)
  post.uniforms.paper.value.set(isLight ? 0xffffff : 0x000000)
}
setTheme(); light.addEventListener('change', setTheme)

function resize() {
  const w = innerWidth, h = innerHeight
  renderer.setSize(w, h, false)
  const pr = renderer.getPixelRatio()
  rt.setSize(Math.round(w * pr), Math.round(h * pr))
  post.uniforms.res.value.set(w * pr, h * pr)
  post.uniforms.cell.value = Math.max(2, Math.round(2 * pr))
  // keep the dither off the words: the header box plus a feather, and a band along the bottom (gl y runs upward)
  const hb = document.querySelector('header').getBoundingClientRect()
  post.uniforms.quiet.value.set((hb.left - 16) * pr, (h - hb.bottom - 16) * pr, (hb.right + 16) * pr, (h - hb.top + 16) * pr)
  post.uniforms.bottomQuiet.value = 56 * pr
  post.uniforms.feather.value = 24 * pr
  camera.aspect = w / h
  moon.position.x = w / h < 0.8 ? -9 : -30
  halo.position.x = moon.position.x
  camera.fov = w / h < 0.8 ? 58 : 40
  camera.updateProjectionMatrix()
}
addEventListener('resize', resize); resize()

// ---------- presence ----------
const pointer = new THREE.Vector2(0, 0)
const S = { attention: 0, open: 0, lastInput: -1e9, watched: 0, reach: 0, present: true, ticks: 0, nextTrace: 0, grown: 3 }
function input(now) { S.lastInput = now; S.present = true }
addEventListener('pointermove', e => {
  const nx = (e.clientX / innerWidth) * 2 - 1, ny = -(e.clientY / innerHeight) * 2 + 1
  const d = Math.hypot(nx - pointer.x, ny - pointer.y)
  pointer.set(nx, ny)
  S.attention = Math.min(1, S.attention + d * 0.6)
  input(performance.now())
})
addEventListener('pointerdown', e => { tick(); input(performance.now()) })
addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.key === 'Tab') return; tick(); input(performance.now()) })
document.addEventListener('pointerleave', () => { S.present = false })
addEventListener('blur', () => { S.present = false })
document.addEventListener('visibilitychange', () => { if (document.hidden) S.present = false })

// a key is one tooth: every ring steps once in its own direction, and one trace lights from the tower out
function tick() {
  S.ticks++
  S.attention = Math.min(1, S.attention + 0.25)
  for (const g of rings) g.userData.target += g.userData.step * g.userData.dir
  seamLit = 1
  const tr = traces[S.nextTrace++ % traces.length]
  tr.userData.lit = 1
}

const eyeWorld = new THREE.Vector3()
const look = new THREE.Vector3()
let last = performance.now()
let state = ''
function setStatus(s, html) { if (s !== state) { state = s; statusEl.innerHTML = html } }

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now
  const idle = (now - S.lastInput) / 1000
  const speed = reduce ? 0.25 : 1

  // attention decays slowly while you are here, quickly once you leave
  S.attention = Math.max(0, S.attention - dt * (S.present ? 0.035 : 0.25))
  const wantOpen = S.present ? smooth(0.05, 0.45, S.attention) : 0
  S.open += (wantOpen - S.open) * Math.min(1, dt * (wantOpen > S.open ? 2.2 : 0.8))
  if (S.open > 0.5) S.watched += dt

  // stillness after it has seen you: it reaches, the cloud comes down and closes around the tower
  const wantReach = S.present && S.open > 0.3 && idle > 4 ? smooth(4, 12, idle) : 0
  S.reach += (wantReach - S.reach) * Math.min(1, dt * (wantReach > S.reach ? 0.35 : 1.6))
  if (wantReach > 0) S.attention = Math.max(S.attention, 0.5)

  // a long gaze raises the tower one segment at a time, up to six
  const shouldHave = Math.min(6, 3 + Math.floor(S.watched / 40))
  while (S.grown < shouldHave) { addSegment(S.grown); S.grown++ }
  for (const s of segs) if (s.scale.y < 1) s.scale.y = Math.min(1, s.scale.y + dt * 0.12 * speed)

  // rings: a slow drift, plus tooth steps that land with an ease-out (the ticking you can almost hear)
  const top = towerTop()
  const cloudY = top + 2.4 - S.reach * (top * 0.45)
  cloud.position.y += (cloudY - cloud.position.y) * Math.min(1, dt * 0.8)
  const squeeze = 1 - S.reach * 0.45
  cloud.scale.setScalar(cloud.scale.x + (squeeze - cloud.scale.x) * Math.min(1, dt * 0.8))
  rings.forEach((g) => {
    const u = g.userData
    u.target += u.drift * dt * speed * (1 - S.reach * 0.9) * (1 - S.open * 0.85)
    u.angle += (u.target - u.angle) * Math.min(1, dt * 14)
    u.mesh.rotation.z = u.angle
    // watched, the train turns its faces toward you (reaching shrinks the whole cloud, so the teeth stay meshed)
    const lean = S.open * (1 - S.reach) * 0.3
    g.rotation.set(-pointer.y * lean, pointer.x * lean, 0)
  })
  for (const tr of traces) {
    tr.userData.lit = Math.max(0, tr.userData.lit - dt * 0.6)
    tr.material.opacity = 0.18 + tr.userData.lit * 0.82 + S.reach * 0.25
  }
  haze.rotation.y += dt * 0.01 * speed
  seamLit = Math.max(0, seamLit - dt / 0.6)
  seam.material.opacity = seamLit

  // eye: opens, finds you, and tracks
  const ey = Math.max(0.03, S.open)
  iris.scale.set(1, ey, 1)
  pupil.scale.set(1, Math.min(1, ey * 1.4), 1)
  lid.visible = S.open < 0.15
  glow.material.opacity = 0.03 + S.open * 0.1 + S.reach * 0.12 + (Math.sin(now / 1400) * 0.5 + 0.5) * 0.04
  eye.getWorldPosition(eyeWorld)
  look.set(pointer.x * 0.17, pointer.y * 0.17 * ey, 0.002)
  pupil.position.lerp(look, Math.min(1, dt * 6))

  // the camera leans a little toward you, and in as it reaches
  if (!reduce) {
    camera.position.x += (camHome.x + pointer.x * 1.4 - camera.position.x) * dt * 1.5
    camera.position.y += (camHome.y + pointer.y * 0.8 - camera.position.y) * dt * 1.5
    camera.position.z += (camHome.z - S.reach * 4 - camera.position.z) * dt * 0.6
  }
  camera.lookAt(0, 7.5 + Math.max(0, top - 9.3) * 0.5 - S.reach * 1.2, 0)

  if (S.grown > 3 && S.reach < 0.2 && S.open > 0.5) setStatus("rise", "it has grown taller")
  else if (S.reach > 0.3) setStatus('reach', 'it is reaching for you')
  else if (S.ticks && now - S.lastInput < 1500 && idle < 1.5 && S.open > 0.3) setStatus('listen', 'it is listening')
  else if (S.open > 0.5) setStatus('see', 'it sees you')
  else if (S.open > 0.08) setStatus('stir', 'it stirs')
  else setStatus('sleep', 'asleep')

  renderer.setRenderTarget(rt); renderer.render(scene, camera)
  renderer.setRenderTarget(null); renderer.render(postScene, postCam)
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)

function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t) }
function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }

// for tests and the screenshot script
window.__machina = { S, tick, rings, segs }
</script>
